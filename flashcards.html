<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tips Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
        }
        .card-container {
            perspective: 1000px;
        }
        .flashcard {
            transition: transform 0.6s ease-in-out, opacity 0.4s;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .btn-control {
            transition: all 0.2s;
        }
        .btn-control:active {
            transform: scale(0.95);
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <script>
        /* 
           Data mapping for the 27 advice cards from image_76e1f4.png 
           Each object contains the image filename and the phrase for speech synthesis.
        */
        const adviceCards = [
            { img: 'park.jpg', text: 'go to the park' },
            { img: 'ointment.jpg', text: 'use some ointment' },
            { img: 'eardrop.png', text: 'use ear drops' },
            { img: 'first_and_kit.jpg', text: 'use a first aid kit' },
            { img: '4.jpg', text: 'take your medicine' },
            { img: 'hot_tea.png', text: 'drink hot tea' },
            { img: '8FB64287-406C-4CA5-B5DC-6CA02CC29743.png', text: 'visit a dentist' },
            { img: 'sweets.png', text: 'not eat too many sweets' },
            { img: 'fastfood.png', text: 'not eat fast food' },
            { img: 'mosquito_spray.png', text: 'use mosquito spray' },
            { img: 'play_computer.png', text: 'not play computer games all day' },
            { img: 'wear_hat.png', text: 'wear a hat' },
            { img: 'visit_doctor.png', text: 'visit a doctor' },
            { img: 'wash_food.png', text: 'wash fruit and vegetables' },
            { img: 'wash_hands.png', text: 'wash your hands' },
            { img: 'do_sports.png', text: 'do sports' },
            { img: 'clean_teeth.png', text: 'clean your teeth' },
            { img: 'cover_mouth.png', text: 'cover your mouth' },
            { img: 'go_to_bed.png', text: 'go to bed early' },
            { img: 'put_plaster.png', text: 'put a plaster on it' },
            { img: 'put_ice.png', text: 'put some ice on it' },
            { img: 'nosal_spray.png', text: 'use nasal spray' },
            { img: 'pain_killer.png', text: 'take a painkiller' },
            { img: 'syrup.png', text: 'take some syrup' },
            { img: 'hot_milk_honey.png', text: 'drink hot milk with honey' },
            { img: 'tissure.png', text: 'use a tissue' },
            { img: 'water.png', text: 'drink water' }
        ];

        let currentIndex = 0;
        let isAutoPlaying = false;
        let autoPlayInterval = null;

        window.onload = () => {
            updateCard();
        };

        function updateCard() {
            const card = adviceCards[currentIndex];
            const displayImg = document.getElementById('display-img');
            const displayText = document.getElementById('display-text');
            const progress = document.getElementById('progress');

            // Fade out effect
            displayImg.style.opacity = 0;
            displayText.style.opacity = 0;

            setTimeout(() => {
                displayImg.src = `img/${card.img}`;
                // Fallback for missing images
                displayImg.onerror = () => { displayImg.src = `https://placehold.co/400x500?text=${card.img}`; };
                
                const fullSentence = `You should ${card.text}`;
                displayText.innerText = fullSentence;
                
                displayImg.style.opacity = 1;
                displayText.style.opacity = 1;

                // Update progress bar
                progress.style.width = `${((currentIndex + 1) / adviceCards.length) * 100}%`;
                
                // Speak the sentence
                speak(fullSentence);
            }, 300);
        }

        function speak(text) {
            // Cancel any ongoing speech
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; // Slightly slower for better clarity
            window.speechSynthesis.speak(utterance);
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % adviceCards.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + adviceCards.length) % adviceCards.length;
            updateCard();
        }

        function toggleAutoPlay() {
            const btn = document.getElementById('btn-autoplay');
            isAutoPlaying = !isAutoPlaying;

            if (isAutoPlaying) {
                btn.innerHTML = 'Stop Auto-play';
                btn.classList.replace('bg-blue-500', 'bg-red-500');
                autoPlayInterval = setInterval(nextCard, 4000); // 4 seconds interval
            } else {
                btn.innerHTML = 'Start Auto-play';
                btn.classList.replace('bg-red-500', 'bg-blue-500');
                clearInterval(autoPlayInterval);
            }
        }
    </script>

    <div class="w-full max-w-md bg-white rounded-3xl p-8 flex flex-col items-center shadow-2xl card-container">
        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 h-2 rounded-full mb-6 overflow-hidden">
            <div id="progress" class="progress-bar bg-green-500 h-full w-0"></div>
        </div>

        <!-- Image Display -->
        <div class="w-full aspect-[3/4] bg-gray-100 rounded-2xl overflow-hidden mb-6 flex items-center justify-center border-4 border-white shadow-inner">
            <img id="display-img" src="" alt="Advice Image" class="max-w-full max-h-full object-contain transition-opacity duration-300">
        </div>

        <!-- Text Display -->
        <div class="text-center mb-8 h-16 flex items-center justify-center">
            <p id="display-text" class="text-2xl font-bold text-slate-700 transition-opacity duration-300"></p>
        </div>

        <div class="flex flex-col w-full gap-4">
            <div class="flex justify-between items-center w-full gap-4">
                <button onclick="prevCard()" class="btn-control flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-4 rounded-2xl font-bold">
                    Back
                </button>
                <button onclick="nextCard()" class="btn-control flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-4 rounded-2xl font-bold">
                    Next
                </button>
            </div>
            
            <button id="btn-autoplay" onclick="toggleAutoPlay()" class="btn-control w-full bg-blue-500 hover:bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200">
                Start Auto-play
            </button>
        </div>
        
        <p class="mt-6 text-slate-400 text-sm">Advice for Health • 27 Cards</p>
    </div>

    <!-- Кнопка возврата в меню -->
    <div class="mt-8">
        <a href="index.html" class="flex items-center gap-2 px-6 py-2 bg-white/80 hover:bg-white text-slate-600 rounded-full shadow-sm transition-all border border-slate-200 font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back to Menu
        </a>
    </div>

</body>
</html>
